# Nightly eval run: the golden set goes through every model and the judge,
# and the traces (with eval labels) are exported to Arize AX.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rag-eval
spec:
  schedule: "0 2 * * *"          # every night at 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: rag-eval
              image: rag-eval:latest
              imagePullPolicy: IfNotPresent   # image built into Minikube
              envFrom:
                - secretRef:
                    name: arize-eval-secrets
              env:
                - name: TRACING_BACKEND
                  value: "arize"
