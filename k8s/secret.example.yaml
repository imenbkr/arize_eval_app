# Credentials for the deployed app, provided as a Kubernetes Secret.
# This is the deployed equivalent of the local .env file.
#
# DO NOT commit real values. Either:
#   (a) fill a copy of this file locally and `kubectl apply -f` it (don't commit), or
#   (b) create it imperatively without a file:
#
#   kubectl create secret generic arize-eval-secrets \
#     --from-literal=ARIZE_SPACE_ID='...' \
#     --from-literal=ARIZE_API_KEY='...' \
#     --from-literal=OPENROUTER_API_KEY='...'
#
apiVersion: v1
kind: Secret
metadata:
  name: arize-eval-secrets
type: Opaque
stringData:
  ARIZE_SPACE_ID: "your-space-id-here"
  ARIZE_API_KEY: "your-api-key-here"
  OPENROUTER_API_KEY: "your-openrouter-api-key-here"